<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background / Floor Plate -->
  <rect x="10" y="10" width="480" height="380" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="2" />
  
  <!-- Outer Walls -->
  <rect x="25" y="25" width="450" height="350" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="4" />

  <!-- Room 1: Mehmonxona (Living Room) - Top Left & Center (250x190) -->
  <rect id="zone-living-room" class="floor-zone" x="27" y="27" width="245" height="185" fill="#1e293b" stroke="#475569" stroke-width="2" />
  
  <!-- Living Room Furniture outlines (sofa, coffee table, TV unit) -->
  <rect x="50" y="50" width="45" height="120" rx="6" fill="#334155" opacity="0.6" />
  <rect x="50" y="70" width="90" height="35" rx="4" fill="#334155" opacity="0.6" />
  <rect x="110" y="75" width="45" height="25" rx="3" fill="#475569" opacity="0.8" />
  <rect x="220" y="50" width="15" height="80" rx="3" fill="#475569" opacity="0.5" />
  
  <!-- Room 2: Oshxona (Kitchen) - Top Right (195x185) -->
  <rect id="zone-kitchen" class="floor-zone" x="275" y="27" width="200" height="185" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <!-- Kitchen counter & island -->
  <path d="M 465 35 L 465 190 L 415 190 L 415 80 L 320 80 L 320 35 Z" fill="#334155" opacity="0.6" />
  <rect x="330" y="115" width="60" height="40" rx="4" fill="#475569" opacity="0.8" />

  <!-- Hallway / Corridor Divider (27 to 475, height 215 to 240) -->
  <rect id="zone-corridor" x="27" y="215" width="448" height="30" fill="#0f172a" opacity="0.4" />

  <!-- Room 3: Yotoqxona (Master Bedroom) - Bottom Left (260x130) -->
  <rect id="zone-bedroom" class="floor-zone" x="27" y="247" width="260" height="126" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <!-- Bed outline -->
  <rect x="50" y="260" width="90" height="100" rx="6" fill="#334155" opacity="0.6" />
  <rect x="55" y="265" width="35" height="20" rx="3" fill="#64748b" opacity="0.7" />
  <rect x="100" y="265" width="35" height="20" rx="3" fill="#64748b" opacity="0.7" />
  <!-- Wardrobe -->
  <rect x="235" y="255" width="45" height="105" rx="3" fill="#475569" opacity="0.6" />

  <!-- Room 4: Vanna Xonasi (Bathroom) - Bottom Right (185x126) -->
  <rect id="zone-bathroom" class="floor-zone" x="290" y="247" width="185" height="126" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <!-- Bathtub & Sink -->
  <rect x="390" y="255" width="75" height="45" rx="8" fill="#334155" opacity="0.7" />
  <rect x="310" y="255" width="45" height="25" rx="5" fill="#475569" opacity="0.8" />

  <!-- Interior Door Swings (dashed arcs) -->
  <path d="M 150 215 A 30 30 0 0 1 180 245" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
  <path d="M 330 215 A 30 30 0 0 0 300 245" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Room Labels & Area -->
  <text x="145" y="145" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Mehmonxona</text>
  <text x="145" y="162" fill="#94a3b8" font-size="11" text-anchor="middle">38 m²</text>

  <text x="375" y="145" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Oshxona</text>
  <text x="375" y="162" fill="#94a3b8" font-size="11" text-anchor="middle">24 m²</text>

  <text x="180" y="310" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Yotoqxona</text>
  <text x="180" y="327" fill="#94a3b8" font-size="11" text-anchor="middle">32 m²</text>

  <text x="370" y="335" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Vanna xonasi</text>
  <text x="370" y="352" fill="#94a3b8" font-size="11" text-anchor="middle">16 m²</text>

  <!-- Interactive Room Hotspot Markers on Minimap -->
  <!-- 1. Mehmonxona Marker (x=145, y=115) -->
  <g id="pin-living-room" class="minimap-pin" transform="translate(145, 105)" cursor="pointer">
    <circle class="pin-pulse" r="16" fill="#3b82f6" fill-opacity="0.3" />
    <circle r="10" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" />
    <circle r="3.5" fill="#ffffff" />
  </g>

  <!-- 2. Oshxona Marker (x=375, y=105) -->
  <g id="pin-kitchen" class="minimap-pin" transform="translate(375, 105)" cursor="pointer">
    <circle class="pin-pulse" r="16" fill="#10b981" fill-opacity="0.3" />
    <circle r="10" fill="#059669" stroke="#ffffff" stroke-width="2.5" />
    <circle r="3.5" fill="#ffffff" />
  </g>

  <!-- 3. Yotoqxona Marker (x=180, y=285) -->
  <g id="pin-bedroom" class="minimap-pin" transform="translate(180, 275)" cursor="pointer">
    <circle class="pin-pulse" r="16" fill="#8b5cf6" fill-opacity="0.3" />
    <circle r="10" fill="#7c3aed" stroke="#ffffff" stroke-width="2.5" />
    <circle r="3.5" fill="#ffffff" />
  </g>

  <!-- 4. Vanna Marker (x=360, y=305) -->
  <g id="pin-bathroom" class="minimap-pin" transform="translate(360, 295)" cursor="pointer">
    <circle class="pin-pulse" r="16" fill="#06b6d4" fill-opacity="0.3" />
    <circle r="10" fill="#0891b2" stroke="#ffffff" stroke-width="2.5" />
    <circle r="3.5" fill="#ffffff" />
  </g>

  <!-- Entrance arrow -->
  <g transform="translate(235, 375)">
    <path d="M 0 5 L 0 -12 M -5 -7 L 0 -12 L 5 -7" fill="none" stroke="#38bdf8" stroke-width="2" />
    <text x="15" y="-3" fill="#38bdf8" font-size="10" font-weight="600">KIRISH</text>
  </g>
</svg>
